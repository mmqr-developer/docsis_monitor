[package]
name = "docsis_monitor"
version = "5.0.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-2.0-or-later"
authors = ["MMQR Development"]
description = "Watches DHCP and TFTP on a DOCSIS plant and raises a trap when provisioning stops"
repository = "https://github.com/example/docsis_server"

# Its own workspace, like every other tool beside the server. This one watches
# packets on a wire and shares nothing with the code that sends them; coupling
# it to the server's crates would make a monitor that only compiles against the
# server it is supposed to be checking on independently.
[workspace]

[[bin]]
name = "docsis_monitor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
daemonize = "0.5.0"
jiff = "0.2.35"
nix = { version = "0.31.3", features = ["fs", "hostname"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# The capture. NOT libpcap: see capture.rs. pnet_datalink opens the same
# AF_PACKET socket tcpdump does, in a wrapper that keeps the unsafe out of this
# crate, and needs no C library on the host or in the musl cross-build.
pnet_datalink = "0.35.0"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = "thin"
panic = "unwind"
